# Deploys the game + backend to Cloudflare (Worker with Static Assets, D1, Durable Object) on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README → Cloudflare backend).
# Without them the job succeeds with a notice and does nothing, so pushes never show a red build.
# Optional secrets: TURN_KEY_ID + TURN_KEY_API_TOKEN (Cloudflare Realtime TURN relay for strict NATs).
# Optional repository variables: SF_ALLOWED_ORIGINS (extra CORS origins, comma separated, e.g. a custom domain).
# GitHub Pages keeps deploying from the main branch as before; this workflow does not touch it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      SF_ALLOWED_ORIGINS: ${{ vars.SF_ALLOWED_ORIGINS }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check for Cloudflare secrets
        id: chk
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy to Cloudflare (see README)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install wrangler
        if: steps.chk.outputs.go == 'true'
        run: npm ci

      - name: Unit tests
        if: steps.chk.outputs.go == 'true'
        run: npm run test:unit

      - name: Find or create the D1 database (writes its id into wrangler.jsonc)
        if: steps.chk.outputs.go == 'true'
        run: node scripts/ensure-d1.mjs stormfall

      - name: Apply D1 migrations
        if: steps.chk.outputs.go == 'true'
        run: npx wrangler d1 migrations apply stormfall --remote

      - name: Build static assets (index.html, vendor/, assets/, manifest.json)
        if: steps.chk.outputs.go == 'true'
        # same-origin API on Cloudflare: the meta stays empty
        run: node scripts/build-public.mjs --api ""

      - name: Deploy
        if: steps.chk.outputs.go == 'true'
        run: |
          ORIGINS="https://kxdjordan.github.io"
          if [ -n "$SF_ALLOWED_ORIGINS" ]; then ORIGINS="$ORIGINS,$SF_ALLOWED_ORIGINS"; fi
          npx wrangler deploy --var "ALLOWED_ORIGINS:$ORIGINS" | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          {
            echo "### Stormfall deployed to Cloudflare"
            if [ -n "$URL" ]; then
              echo "- Game: $URL"
              echo "- API health: $URL/api/health"
              echo "- To let the GitHub Pages copy use cloud saves, set \`<meta name=\"sf-api\" content=\"$URL\">\` in index.html."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: TURN secrets (optional)
        if: steps.chk.outputs.go == 'true' && env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != ''
        run: |
          node -e 'process.stdout.write(JSON.stringify({TURN_KEY_ID:process.env.TURN_KEY_ID,TURN_KEY_API_TOKEN:process.env.TURN_KEY_API_TOKEN}))' > turn.json
          npx wrangler secret bulk turn.json
          rm -f turn.json
